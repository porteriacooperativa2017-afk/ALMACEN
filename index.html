<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COFARMEN Almacén</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Librería para el Escáner de Cámara (carga local primero para APK) -->
  <script src="vendor/html5-qrcode.min.js" type="text/javascript"></script>
  <script type="text/javascript">
    // Si la copia local no carga la clase Html5Qrcode, cargar CDN como fallback (2s)
    setTimeout(function(){
      if(typeof Html5Qrcode === 'undefined'){
        var s = document.createElement('script');
        s.src = 'https://unpkg.com/html5-qrcode';
        document.head.appendChild(s);
      }
    }, 2000);
  </script>
</head>
<body>
  <div class="app-shell">
    <div id="welcome-screen" class="screen welcome-screen">
      <div class="welcome-card card">
        <div class="logo-area logo-area-large">
          <img id="logo-placeholder" src="LOGO COFAR.jpeg" alt="Logo COFAR" onerror="this.onerror=null;this.src='LOGO COFAR.jpg';" />
        </div>
        <button id="btn-abrir-screen" class="btn-primary btn-open" onclick="abrirAlmacen()">ABRIR ALMACEN</button>
      </div>
    </div>

    <div id="workspace-screen" class="screen workspace-screen" style="display:none;">
      <div class="workspace-header">
        <div class="header-inner">
          <div class="logo-area">
            <img id="logo-placeholder-workspace" src="LOGO COFAR.jpeg" alt="Logo COFAR" onerror="this.onerror=null;this.src='LOGO COFAR.jpg';" />
          </div>
          <div>
            <div class="app-kicker">COFARMEN</div>
            <h2>Almacén</h2>
          </div>
        </div>
      </div>

      <div class="container mobile-container">
        <section class="card timer-card">
          <div class="timer-label">Hora de inicio</div>
          <div class="timer" id="timer-display">Cerrado</div>
        </section>

        <section class="card">
          <h3>📷 Escáner</h3>
          <div id="reader"></div>
          <p id="scanned-result">Código: <b>Sin escanear</b></p>
        </section>

        <section class="card">
          <h3>📝 Movimiento</h3>

          <label for="tipo">Tipo de Operación</label>
          <select id="tipo">
            <option value="RETIRO">RETIRO (Maestranza)</option>
            <option value="INGRESO">INGRESO (Stock)</option>
          </select>

          <label for="codigo">Código del Insumo</label>
          <input type="text" id="codigo" placeholder="Escanea o escribe aquí" autofocus>

          <label for="descripcion">Descripción del producto</label>
          <input type="text" id="descripcion" placeholder="Descripción (si no existe en stock)" />

          <label for="cantidad">Cantidad</label>
          <input type="number" id="cantidad" value="1" min="1">

          <div id="validation-message" style="display:none; margin-top:10px; padding:8px 10px; border-radius:8px; font-size:12px; font-weight:600;"></div>

          <div class="split-actions">
            <button class="btn-primary" type="button" onclick="startCamera()">Cámara</button>
            <button class="btn-primary" type="button" onclick="stopCamera()">Detener</button>
          </div>

          <label for="maestranza">Maestranza</label>
          <input type="text" id="maestranza" placeholder="Nombre completo">

          <label for="guardia">Guardia</label>
          <input type="text" id="guardia" placeholder="Nombre del guardia">

          <button class="btn-primary" onclick="registrar()">Confirmar Movimiento</button>
        </section>

        <section class="card">
          <h3>📚 Ingreso rápido</h3>
          <label for="ing-codigo">Código</label>
          <input id="ing-codigo" placeholder="Código" />
          <label for="ing-desc">Descripción</label>
          <input id="ing-desc" placeholder="Descripción del producto" />
          <label for="ing-cant">Cantidad</label>
          <input id="ing-cant" type="number" min="1" value="1" />
          <button class="btn-small" onclick="registrarRapidoIngreso()">Registrar Ingreso</button>
        </section>

        <section class="card">
          <h3>📧 Notificaciones</h3>
          <label for="contact-email-input">Correo de notificaciones</label>
          <input id="contact-email-input" class="contact-email-input" type="email" placeholder="Correo de contacto" />
          <button class="btn-small" onclick="generarReporteGerencial()">Generar Reporte</button>
          <button class="btn-small" onclick="enviarReporteAGerencia()">Enviar a Gerencia</button>
        </section>

        <section id="stock-section" class="card">
          <h3>🔍 Stock</h3>
          <input type="text" id="filtro" oninput="filtrarInsumos()" placeholder="Buscar por código o nombre...">
          <div id="lista-insumos" class="stock-list"></div>
        </section>

        <button class="btn-primary btn-close" id="btn-cerrar" onclick="cerrarAlmacen()">CERRAR ALMACEN</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
