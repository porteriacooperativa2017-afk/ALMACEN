<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COFARMEN Almacén</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Librería para el Escáner de Cámara -->
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <div class="logo-area">
        <!-- Logo incluido desde la carpeta del proyecto -->
        <img id="logo-placeholder" src="LOGO COFAR.jpeg" alt="Logo COFAR" onerror="this.onerror=null;this.src='LOGO COFAR.jpg';" />
        <div class="logo-hint"></div>
      </div>
      <h2>📦 Almacén COFARMEN</h2>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar card">
      <h3>📚 Menú</h3>
      <div class="sidebar-section">
        <label for="contact-email-input">Correo de notificaciones</label>
        <input id="contact-email-input" class="contact-email-input" type="email" placeholder="Correo de contacto" />
      </div>
      <div class="sidebar-section">
        <button class="btn-small" onclick="toggleStockView()">Ver/ocultar Vista de Stock</button>
      </div>
      <div class="sidebar-section card" style="padding:10px;">
        <h4>Ingreso Rápido</h4>
        <label for="ing-codigo">Código</label>
        <input id="ing-codigo" placeholder="Código" />
        <label for="ing-desc">Descripción</label>
        <input id="ing-desc" placeholder="Descripción del producto" />
        <label for="ing-cant">Cantidad</label>
        <input id="ing-cant" type="number" min="1" value="1" />
        <button class="btn-small" style="margin-top:8px;" onclick="registrarRapidoIngreso()">Registrar Ingreso</button>
      </div>
      <div class="sidebar-section">
        <button class="btn-small" onclick="abrirIngresoRapido()">Ingreso de Mercadería</button>
        <button class="btn-small" onclick="abrirSalidaRapido()">Salida de Mercadería</button>
        <button class="btn-small" onclick="generarReporteGerencial()">Generar Reporte Gerencial</button>
        <button class="btn-small" onclick="enviarReporteAGerencia()">Enviar a Gerencia (prueba)</button>
      </div>

      <div class="sidebar-section">
        <h4>Apertura / Cierre</h4>
        <label for="apertura-maestranza">Maestranza</label>
        <input id="apertura-maestranza" placeholder="Nombre maestranza">
        <label for="apertura-guardia">Guardia</label>
        <input id="apertura-guardia" placeholder="Nombre guardia">
        <div style="display:flex;gap:8px;margin-top:8px;">
          <button class="btn-small" id="btn-abrir" onclick="abrirAlmacen()">ABRIR ALMACEN</button>
          <button class="btn-small" id="btn-cerrar" onclick="cerrarAlmacen()" disabled>CERRAR ALMACEN</button>
        </div>
        <div class="timer" id="timer-display">Cerrado</div>
      </div>
    </aside>

    <main class="container">
    <!-- PANEL DE ESCÁNER POR CÁMARA -->
    <section class="card">
      <h3>📷 Escáner de Código de Barras</h3>
      <div id="reader"></div>
      <p id="scanned-result">Código: <b>Sin escanear</b></p>
    </section>

    <!-- FORMULARIO DE REGISTRO -->
    <section class="card">
      <h3>📝 Registrar Movimiento</h3>
      
      <label for="tipo">Tipo de Operación</label>
      <select id="tipo">
        <option value="RETIRO">RETIRO (Maestranza)</option>
        <option value="INGRESO">INGRESO (Stock)</option>
      </select>

      <label for="codigo">Código del Insumo</label>
      <input type="text" id="codigo" placeholder="Escanea o escribe aquí" autofocus>

      <label for="descripcion">Descripción del producto</label>
      <input type="text" id="descripcion" placeholder="Descripción (si no existe en stock)" />

      <label for="cantidad">Cantidad (multiplicador) — ej. 5 x código escaneado</label>
      <input type="number" id="cantidad" value="1" min="1">

      <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="btn-primary" type="button" onclick="startCamera()">Iniciar Cámara</button>
        <button class="btn-primary" type="button" onclick="stopCamera()">Detener Cámara</button>
      </div>

      <label for="maestranza">Personal Maestranza (Retira)</label>
      <input type="text" id="maestranza" placeholder="Nombre completo">

      <label for="guardia">Guardia en Turno (Controla)</label>
      <input type="text" id="guardia" placeholder="Nombre del guardia">

      <button class="btn-primary" onclick="registrar()">Confirmar Movimiento</button>
    </section>

    <!-- BUSCADOR Y FILTRO DE STOCK -->
    <section id="stock-section" class="card">
      <h3>🔍 Consulta y Filtro de Stock</h3>
      <input type="text" id="filtro" oninput="filtrarInsumos()" placeholder="Buscar por código o nombre...">
      
      <div id="lista-insumos" class="stock-list">
        <!-- Se llena dinámicamente -->
      </div>
    </section>

    <!-- REPORTES MANUALES -->
    <section class="card">
      <button class="btn-success" onclick="solicitarReporte()">📊 Generar Reporte Gerencial Ahora</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
